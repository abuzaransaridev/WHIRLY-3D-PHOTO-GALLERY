<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whirly - 3D Photo Gallery</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        } 
        body {
            background:
                radial-gradient(ellipse at 15% 40%, rgba(0, 140, 255, 0.16), transparent 40%),
                radial-gradient(ellipse at 85% 60%, rgba(110, 50, 255, 0.14), transparent 40%),
                linear-gradient(135deg, #080d18, #101827, #05070d);
            font-family: Arial, sans-serif;
            color: #ffffff;
            height: 80vh;
            
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        header {
            width: 100%;
            padding: 30px 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .logo {
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 30px;
        }

        nav a {
            color: #888888;
            text-decoration: none;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: color 0.3s;
        }

        nav a:hover,
        nav .active {
            color: #ffffff;
        }

        .main_container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
            padding: 20px;
            gap: 10px;
			background:green;
			background: rgba(255, 255, 255, 0.03);
			border-radius: 20px;			
        }
		.gallery-heading {
			text-align: center;
			margin-bottom: 40px;
			padding: 20px;
		}

		.gallery-heading h1 {
			font-size: 42px;
			color: #ffffff;
			margin-bottom: 12px;
			letter-spacing: 1px;
		}

		.gallery-heading h3 {
			font-size: 16px;
			color: #8abfff;
			letter-spacing: 4px;
			margin-bottom: 15px;
		}

		.gallery-heading p {
			font-size: 15px;
			color: #b8c5d9;
			line-height: 1.6;
		}		
        .grid-3d {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 10px;
            width: 50%;
            height: 400px;
            background: transparent;
        }
		.box1, .box2 {
			
            transition-duration: 3s;			
		}
		.box1
		{ 		
			transition-duration:4s;
            transform: rotateX(20deg) rotateY(70deg) rotateZ(-3deg);
            transform-style: preserve-3d;
            transition-property: transform;
		}		
        .main_container:hover .box1 {
            transform: rotateX(10deg) rotateY(70deg) rotateZ(-5deg);
            transform-style: preserve-3d;
            transition-property: transform;
            transition-duration: 3s;
        }

        .main_container:hover .box2 {
            transform: rotateX(10deg) rotateY(-70deg) rotateZ(5deg);
            transform-style: preserve-3d;
            transition: transform 3s;
			transition-timing-function:ease-in-out;
        }

        .photo_card {
            background: #111827;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 5px;
            overflow: hidden;
            box-shadow: -15px 20px 35px rgba(0, 0, 0, 0.7);
            transform-style: preserve-3d;
            transition: transform 0.4s ease, box-shadow 0.4s ease;
            cursor: pointer;
        }

        .photo_card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            filter: brightness(0.95);
            transition: filter 0.3s;
        }

        .left_card:hover {
            transform: translateZ(55px) rotateY(-40deg);
            box-shadow: -25px 35px 50px rgba(0, 140, 255, 0.25);
        }

        .right_card:hover {
            transform: translateZ(55px) rotateY(40deg);
            box-shadow: -25px 35px 50px rgba(110, 50, 255, 0.25);
        }

        .photo_card:hover img {
            filter: brightness(1.1);
        }

        footer {
            width: 100%;
            padding: 30px 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            z-index: 10;
        }

        .category_bar {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.09);
            padding: 6px 20px;
            border-radius: 20px;
            gap: 25px;
        }

        .arrow_btn {
            background: none;
            border: none;
            color: #8290a5;
            cursor: pointer;
            font-size: 14px;
            transition: color 0.3s;
        }
        .arrow_btn:hover {
            color: #38bdf8;
        }
        .cart_item {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #8290a5;
            text-decoration: none;
            transition: color 0.3s;
        }

        .cart_item:hover,
        .cart_item.active {
            color: #38bdf8;
        }

        .footer_bottom_info {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 10px;
            color: #667085;
            letter-spacing: 1px;
        }

        .footer_bottom_info a {
            color: #8290a5;
            text-decoration: none;
        }

        .footer_bottom_info a:hover {
            color: #38bdf8;
        }

        .right_controls {
            display: flex;
            gap: 30px;
        }

    </style>
</head>
